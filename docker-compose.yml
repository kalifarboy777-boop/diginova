services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diginova
      POSTGRES_USER: diginova
      POSTGRES_PASSWORD: diginova
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: diginova
      MINIO_ROOT_PASSWORD: diginova-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 diginova diginova-secret; do sleep 1; done;
      mc mb -p local/products-private;
      mc mb -p local/public-assets;
      mc anonymous set download local/public-assets;
      exit 0;"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  miniodata:
